name: Language binding unit tests
on:
  push:
    paths: ['bindings/**', '.github/workflows/bindings.yml']
  pull_request:
    paths: ['bindings/**', '.github/workflows/bindings.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bindings:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        websocket: ['==1.8.0', '>=1.8,<2']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.22.x'
          cache-dependency-path: bindings/go/go.sum
      - run: python -m pip install ./bindings/python "websocket-client${{ matrix.websocket }}"
      - run: python -m unittest discover -s bindings/python/tests -v
      - run: go test -race ./...
        working-directory: bindings/go
